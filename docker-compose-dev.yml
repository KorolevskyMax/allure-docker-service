volumes:
  allure-docker-service:
    driver: local

services:
  allure-docker-service:
    platform: linux/amd64
    build:
      context: ../allure-docker-service
      dockerfile: docker/Dockerfile
      args:
        ALLURE_RELEASE: 2.35.1
        BUILD_VERSION: 2.35.1
        JDK: eclipse-temurin:11-jre-noble
    environment:
      DEV_MODE: 1
      CHECK_RESULTS_EVERY_SECONDS: NONE
      KEEP_HISTORY: 1
      KEEP_HISTORY_LATEST: 5
      #URL_PREFIX: "/my-prefix"
      SECURITY_USER: "qauser"
      SECURITY_PASS: "n2s5u22p"
      # SECURITY_VIEWER_USER: "view_user"
      # SECURITY_VIEWER_PASS: "view_pass"
      MIGRATE_USERS: 1
      SECURITY_ENABLED: 1
      MAKE_VIEWER_ENDPOINTS_PUBLIC: 0
      OPTIMIZE_STORAGE: 0
      API_RESPONSE_LESS_VERBOSE: 0
      TLS: 1
    ports:
      - "${ALLURE_DOCKER_SERVICE_API_PORT}:5050"
    volumes:
      - ./.data/allure-docker-service/allure-results:/app/allure-results
      - ./.data/allure-docker-service/projects:/app/allure-docker-api/static/projects
      - ./.data/allure-docker-service/users:/app/allure-docker-api/static/users
      
  allure-ui:
    image: "frankescobar/allure-docker-service-ui"
    environment:
      ALLURE_DOCKER_PUBLIC_API_URL: "http://localhost:${ALLURE_DOCKER_SERVICE_API_PORT}"
      ALLURE_DOCKER_PUBLIC_API_URL_PREFIX: ""
    ports:
      - "7474:5252"